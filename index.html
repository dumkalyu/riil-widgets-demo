<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Витрина виджетов РИИЛ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fff;--tx:#000;--hn:#8E8E93;--sec:#F1F1F4;--ln:#2481CC;--chat:#DCE6D9;--red:#E0002D;--rt:#D0002A}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sec);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
header{padding:16px 16px 4px}
header h1{margin:0;font-size:22px;line-height:1.15;letter-spacing:-.01em;font-weight:800}
header h1 span{color:var(--rt)}
header p{margin:4px 0 0;color:var(--hn);font-size:14px}
nav{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;position:sticky;top:0;z-index:2;background:var(--sec)}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;border-radius:18px;padding:8px 13px;background:var(--bg);font-weight:600;font-size:14px;white-space:nowrap;transition:background .2s,color .2s}
nav button.on{background:var(--red);color:#fff}
.lead{margin:0 16px calc(24px + env(safe-area-inset-bottom));padding:12px 14px;border-radius:14px;background:var(--bg)}
.lead b{display:block;font-size:16px;margin-bottom:3px}
.lead p{margin:0;color:var(--hn);font-size:14px}
.lead .why{margin-top:6px;color:var(--tx)}
.lead .why:before{content:"Зачем: ";font-weight:700;color:var(--rt)}
.chat{margin:0 10px;padding:10px 8px 6px;border-radius:18px;background:var(--chat)}
.msg{max-width:100%;background:var(--bg);border-radius:16px 16px 16px 6px;margin:0 0 6px;overflow:hidden}
.msg .t{padding:8px 12px;white-space:pre-line}
.fw{padding:8px 12px 0;font-size:13px;color:var(--ln)}
iframe{display:block;width:100%;border:0;height:300px;background:var(--bg)}
.meta{font-size:12px;color:var(--hn);text-align:right;padding:0 10px 6px}
.rx{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 4px}
.rx button{border:0;border-radius:14px;padding:4px 10px;font-size:14px;background:var(--bg);font-variant-numeric:tabular-nums;transition:transform .12s}
.rx button:active{transform:scale(.92)}
.rx button.me{background:var(--red);color:#fff}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px}
.acts button{border:0;border-radius:12px;padding:11px 14px;font-weight:600;font-size:14px;background:var(--bg)}
.acts .pr{background:var(--red);color:#fff}
.acts .pr.on{background:#6A1FD1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,8px);background:#111;color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;width:max-content;max-width:calc(100% - 32px);text-align:center;z-index:5}
.toast.on{opacity:.94;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>Виджеты для <span>РИИЛ</span></h1><p>Живые посты в Telegram — нажимайте и играйте</p></header>
<nav id="tabs"></nav>
<div class="chat">
<div class="msg"><div class="t" id="post"></div><div class="meta" id="tm1"></div></div>
<div class="msg"><div class="fw">Переслано от <b>РИИЛ Виджеты</b></div><iframe id="w" title="Виджет"></iframe><div class="meta" id="tm2"></div></div>
<div class="rx" id="rx"></div>
</div>
<div class="acts" id="acts"></div>
<div class="lead" id="lead"></div>
<div class="toast" id="toast" role="status"></div>
